name = "juliomcruz-contact-form"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# The worker will be deployed to form.juliomcruz.xyz
# Add this custom domain in Cloudflare Dashboard after deployment:
# Workers & Pages > juliomcruz-contact-form > Settings > Triggers > Custom Domains

[vars]
FROM_EMAIL = "contact@juliomcruz.xyz"
TO_EMAIL = "julio.cruz@eb-ms.net"
ALLOWED_ORIGIN = "https://juliomcruz.xyz"

# RESEND_API_KEY must be set as a secret, never committed:
# wrangler secret put RESEND_API_KEY
